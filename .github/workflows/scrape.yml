name: Atualizar Vagas Automaticamente

on:
  schedule:
    # Executa a cada 4 horas todos os dias
    - cron: '0 */4 * * *'
  workflow_dispatch: # Permite disparar manualmente pelo botão no GitHub
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 pyyaml httpx

      - name: Executar Varredura e Exportar JSON
        run: |
          python export_static.py

      - name: Fazer Commit e Push dos Dados Atualizados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/stats.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: atualizar vagas de Pelotas & Rio Grande [skip ci]" && git push)
