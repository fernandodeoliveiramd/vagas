# Configuração de Palavras-Chave e Categorias de Vagas
categories:
  industrial_eletrica:
    name: "Industrial, Elétrica & Eletrônica"
    color: "#2563eb" # Blue
    roles:
      - name: "Eletricista"
        search_terms:
          - "eletricista"
          - "eletricista industrial"
          - "eletricista predial"
          - "eletricista de manutencao"
          - "eletricista montador"
          - "eletricista forca e controle"
        positive_keywords:
          - "eletricista"
          - "eletricidade"
          - "alta tensao"
          - "baixa tensao"
          - "nr10"
          - "nr-10"
          - "painel eletrico"
          - "instalacoes eletricas"
          - "comandos eletricos"

      - name: "Eletroinstrumentista"
